name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test extras
        run: python -m pip install -e ".[dev,numpy,pandas]"
      - name: Run end-to-end test runner
        run: python run_all_tests.py
      - name: Lint
        run: ruff check src tests
      - name: Build distributions
        run: python -m build
      - name: Run release artifact preflight
        run: python scripts/release_preflight.py
      - name: Validate distributions
        shell: bash
        run: python -m twine check dist/*

  torch-integration:
    name: PyTorch optional integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package with all optional integrations
        run: python -m pip install -e ".[dev,numpy,pandas,torch]"
      - name: Run complete regression suite
        run: python run_all_tests.py
      - name: Run three-pipeline integration validation
        run: python run_three_pipeline_validation.py
